<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add clinic | ClinicFlow developer</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="patient-page">
  <header class="topbar"><a class="brand" href="/platform.html"><span class="brand-mark">✚</span><span>ClinicFlow developer</span></a><a href="/platform.html">Back to clinics</a></header>
  <main class="patient-shell"><section class="form-card"><div class="card-heading"><p class="eyebrow">PLATFORM OWNER</p><h2>Onboard a new clinic</h2><p class="muted">This creates the clinic and its first clinic-admin account together.</p></div><form id="add-clinic-form"><label>Clinic name<input name="clinicName" required maxlength="120" placeholder="GJ Clinic"></label><label>Subdomain / URL<input name="subdomain" required pattern="[a-z0-9-]+" placeholder="gj-clinic"><small class="field-help">Use the subdomain label only, without https://.</small></label><label>Admin username<input name="adminUsername" required minlength="3" maxlength="80" placeholder="gjadmin"></label><label>Admin password<input name="adminPassword" type="password" required minlength="10" placeholder="Strong temporary password"><small class="field-help">At least 10 characters with uppercase, lowercase, number, and symbol.</small></label><button class="primary-button" type="submit">Create clinic <span>→</span></button><p id="add-clinic-message" class="field-help" role="status"></p></form></section></main><script src="/js/add-clinic.js"></script>
</body></html>
