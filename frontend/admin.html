<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin | ClinicFlow</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="dashboard-page admin-view"><header class="topbar"><div class="brand"><span class="brand-mark">✚</span><span>ClinicFlow admin</span></div><button id="logout" class="text-link">Sign out</button></header>
<main class="dashboard-shell"><div class="page-intro"><div><p class="eyebrow">ADMIN DASHBOARD</p><h1>Clinic operations</h1><p class="consultation-status">Staff and daily reporting for this clinic</p></div></div><section class="metric-grid"><div class="metric-card accent"><span>WAITING NOW</span><strong id="report-waiting">—</strong></div><div class="metric-card"><span>COMPLETED TODAY</span><strong id="report-completed">—</strong></div><div class="metric-card"><span>IN CONSULTATION</span><strong id="report-consulting">—</strong></div></section><section class="table-section"><div class="section-heading"><div><p class="eyebrow">STAFF</p><h2>Clinic team</h2></div></div><form id="staff-form" class="form-row"><input name="name" required placeholder="Full name"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Temporary password"><select name="role"><option value="receptionist">Receptionist</option><option value="doctor">Doctor</option><option value="admin">Admin</option></select><button class="primary-button" type="submit">Add staff</button></form><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody id="staff-body"></tbody></table></div></section></main><script src="/js/app.js"></script></body></html>
