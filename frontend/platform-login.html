<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Developer sign in | ClinicFlow</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="patient-page">
  <header class="topbar"><a class="brand" href="/start"><span class="brand-mark">✚</span><span>ClinicFlow developer</span></a><span class="status-pill"><i></i> Private platform access</span></header>
  <main class="patient-shell"><section class="form-card"><div class="card-heading"><p class="eyebrow">DEVELOPER PORTAL</p><h2>Sign in with mobile OTP</h2><p class="muted">Use the registered platform-owner mobile number.</p></div><form id="platform-otp-login-form"><label>Mobile number<input name="phone" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="9876543210"></label><button class="primary-button" type="submit">Send OTP <span>→</span></button><p id="platform-otp-message" class="field-help" role="status"></p></form><form id="platform-otp-verify-form" class="hidden"><label>6-digit OTP<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary-button" type="submit">Verify and open clinic list <span>→</span></button><p id="platform-otp-verify-message" class="field-help" role="alert"></p></form><p class="form-note"><a id="show-platform-password-login" class="text-link" href="#platform-login-form">Use email and password instead</a></p><form id="platform-login-form" class="hidden"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Open clinic list <span>→</span></button><p id="platform-login-error" class="field-help" role="alert"></p></form></section></main>
  <script src="/js/platform.js"></script>
</body></html>
