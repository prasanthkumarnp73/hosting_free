<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff sign in | ClinicFlow</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="patient-page">
  <header class="topbar"><div class="brand"><span class="brand-mark">✚</span><span>ClinicFlow staff</span></div><span class="status-pill"><i></i> Secure sign in</span></header>
  <main class="patient-shell"><section class="form-card"><div class="card-heading"><p class="eyebrow">STAFF ACCESS</p><h2>Sign in to your clinic</h2><p class="muted">Your clinic is selected from this subdomain.</p></div><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required placeholder="you@clinic.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in <span>→</span></button><p id="login-error" class="field-help" role="alert"></p></form></section></main>
  <script src="/js/app.js"></script>
</body></html>
