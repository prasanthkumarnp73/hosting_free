<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff sign in | ClinicFlow</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="patient-page">
  <header class="topbar"><div class="brand"><span class="brand-mark">✚</span><span>ClinicFlow staff</span></div><span class="status-pill"><i></i> Secure sign in</span></header>
  <main class="patient-shell"><section class="form-card"><div class="card-heading"><p class="eyebrow">STAFF ACCESS</p><h2>Sign in with mobile OTP</h2><p class="muted">Use the registered 10-digit mobile number.</p></div><form id="otp-login-form"><label>Mobile number<input name="phone" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="9876543210"></label><button class="primary-button" type="submit">Send OTP <span>→</span></button><p id="otp-login-message" class="field-help" role="status"></p></form><form id="otp-verify-form" class="hidden"><label>6-digit OTP<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary-button" type="submit">Verify and sign in <span>→</span></button><p id="otp-verify-message" class="field-help" role="alert"></p></form><p class="form-note"><a id="show-password-login" class="text-link" href="#login-form">Use email and password instead</a></p><form id="login-form" class="hidden"><label>Email<input name="email" type="email" autocomplete="username" required placeholder="you@clinic.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in <span>→</span></button><p id="login-error" class="field-help" role="alert"></p></form><p class="form-note"><a id="show-recovery" class="text-link" href="#recovery-form">Forgot your user ID or password?</a></p><form id="recovery-form" class="hidden"><p class="eyebrow">ACCOUNT RECOVERY</p><label>Your name<input name="name" required></label><label>Email<input name="email" type="email" placeholder="you@clinic.com"></label><label>Mobile number<input name="phone" type="tel" placeholder="Registered mobile number"></label><select name="role" required><option value="receptionist">Receptionist</option><option value="doctor">Doctor</option><option value="admin">Clinic admin</option></select><button class="text-link" type="submit">Contact platform owner</button><p id="recovery-message" class="field-help" role="status"></p></form></section></main>
  <script src="/js/app.js"></script>
</body></html>
